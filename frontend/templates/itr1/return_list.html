{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Your ITR-1 Returns · stacos.ai</title>
  <link rel="stylesheet" href="{% static 'itr1/css/main.css' %}">
  <style>
    body { display: block; padding: 2rem; max-width: 760px; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>ITR-1 &middot; AY 2026-27</h1>
  <p><a href="{% url 'itr1:return_create' %}">+ Start a new return</a></p>
  <table>
    <thead><tr><th>#</th><th>PAN</th><th>Updated</th></tr></thead>
    <tbody>
      {% for r in returns %}
      <tr>
        <td><a href="{% url 'itr1:personal_info' r.pk %}">{{ r.pk }}</a></td>
        <td>{{ r.pan|default:"—" }}</td>
        <td>{{ r.updated_at }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="3">No returns yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
