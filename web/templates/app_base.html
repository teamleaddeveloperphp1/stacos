{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}STACOS.ai{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'shared/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'shared/css/app.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block topbar %}
  <div class="app-topbar">
    <div class="row">
      <a class="brand" href="{% if user.is_authenticated %}{% url 'catalog:dashboard' %}{% else %}{% url 'accounts:login' %}{% endif %}">
        <span class="brand-mark"></span>
        <span>STACOS<span class="text-blue">.ai</span></span>
      </a>
      {% if user.is_authenticated %}
        <div class="app-user-menu" id="app-user-menu">
          <button type="button" onclick="document.getElementById('app-user-menu').classList.toggle('open')">
            <span class="avatar">{{ user.first_name|default:user.email|first|upper }}</span>
            {{ user.first_name|default:user.email }}
          </button>
          <div class="menu">
            <a href="{% url 'accounts:settings' %}">Settings</a>
            <form method="post" action="{% url 'accounts:logout' %}">
              {% csrf_token %}
              <button type="submit">Sign out</button>
            </form>
          </div>
        </div>
      {% endif %}
    </div>
  </div>
  {% endblock %}
  <main class="app-main{% block main_class %}{% endblock %}">
    {% block breadcrumb %}{% endblock %}
    {% for message in messages %}
      <div class="status-msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var EYE_OPEN = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
      var EYE_OFF = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.77 9.77 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>';

      document.querySelectorAll('input[type="password"]').forEach(function (input) {
        var wrapper = document.createElement('div');
        wrapper.className = 'password-field';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);

        var toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'password-toggle';
        toggle.setAttribute('aria-label', 'Show password');
        toggle.innerHTML = EYE_OPEN;
        wrapper.appendChild(toggle);

        toggle.addEventListener('click', function () {
          var showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          toggle.innerHTML = showing ? EYE_OPEN : EYE_OFF;
          toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        });
      });
    });
  </script>
</body>
</html>
